[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="vifasttts"
version="0.1.0"
requires-python=">=3.10"
dependencies=["numpy","pyyaml","typer","pydantic"]
[project.optional-dependencies]
dev=["pytest"]
train=["torch","torchaudio"]
onnx=["onnx","onnxruntime"]
[project.scripts]
vifasttts="vifasttts.cli:app"
[tool.hatch.build.targets.wheel]
packages=["src/vifasttts"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
