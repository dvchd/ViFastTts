project: ViFastTts
seed: 42
language: vi
sample_rate: 24000

# Run thật: small (6,1M) trên dataset kênh @codelung (13.225 clip · 51,07 giờ).
# Đo thật trên Mac mini M6: model MPS 0,478 s/bước, dataloader 6,31 s/batch (nghẽn)
# → cache feature trước (cache-features --workers 8), sau đó 60k bước ≈ 9-10h.
# Xem docs/TRAINING_RUN_CODELUNG.md.
input:
  unit: syllable
  features: [onset, medial, nucleus, coda, tone, boundary, punctuation]
  dialect_conditioning: false
  speaker_conditioning: false
  style_conditioning: false

mel:
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 100
  f_min: 0
  f_max: 12000

model:
  component_dim: 64
  hidden_size: 192
  encoder_layers: 4
  decoder_layers: 2
  attention_heads: 4
  ffn_size: 768
  conv_kernel_size: 15
  dropout: 0.1
  duration_layers: 3
  variance_layers: 3
  use_phonation: false

training:
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_steps: 60000
  warmup_steps: 6000
  grad_clip: 1.0
  log_every: 50
  validate_every: 1000
  validate_batches: 40   # MPS: validation dài làm phình bộ nhớ Metal → lấy 40 batch
  save_every: 1000
  num_workers: 6
  mixed_precision: true
  device: auto
  cache_features: false
  cache_dir: cache/codelung   # đã tính trước bằng `cache-features --workers 8`

phonation:
  enabled: false

vocoder_training:
  batch_size: 8
  learning_rate: 0.0002
  max_steps: 30000
  num_workers: 6
  log_every: 100
  save_every: 2000
  crop_frames: 128   # ~1,36 giây @ hop 256 — random crop chuẩn GAN, bước nhanh
  hidden: 192
  upsample_ratio: 4
  discriminator_channels: 16
  mel_weight: 45.0
  feature_matching_weight: 2.0
  adversarial_weight: 1.0

loss_weights:
  mel: 1.0
  duration: 1.0
  f0: 1.0
  vuv: 0.5
  energy: 0.5
  tone: 0.25
