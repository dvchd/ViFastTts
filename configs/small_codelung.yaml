project: ViFastTts
seed: 42
language: vi
sample_rate: 24000

# Run thật: small (6,1M) trên dataset kênh @codelung (13.225 clip · 51,07 giờ).
# Đo thật trên Mac mini M6: model MPS 0,478 s/bước, dataloader 6,31 s/batch (nghẽn)
# → cache feature trước (cache-features --workers 8), sau đó 60k bước ≈ 9-10h.
# Xem docs/TRAINING_RUN_CODELUNG.md.
input:
  unit: syllable
  features: [onset, medial, nucleus, coda, tone, boundary, punctuation]
  dialect_conditioning: false
  speaker_conditioning: false
  style_conditioning: false

mel:
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 100
  f_min: 0
  f_max: 12000
  # Biểu diễn mới (REVISION_PLAN_V2 §2): log-MAGNITUDE clamp 1e-5 (thay log-power 1e-6)
  # + chuẩn hoá toàn cục per-bin. Tạo stats bằng:
  #   python tools/compute_mel_stats.py --manifest data/codelung/train.jsonl \
  #       --config configs/small_codelung.yaml --out data/codelung/mel_stats.json
  log_magnitude: true
  normalize_path: data/codelung/mel_stats.json

# F0: pyworld harvest + stonemask (thay autocorrelation — tránh lỗi quãng tám), cần extra 'f0'.
f0:
  method: pyworld
  f_min: 70
  f_max: 400
  interpolate: true

model:
  component_dim: 64
  hidden_size: 192
  encoder_layers: 4
  decoder_layers: 2
  attention_heads: 4
  ffn_size: 768
  conv_kernel_size: 15
  dropout: 0.1
  duration_layers: 3
  variance_layers: 3
  use_phonation: false

training:
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_steps: 60000
  warmup_steps: 6000
  # val chững từ ~5k bước (LR hằng số) → giảm cos từ warmup tới 5% base_lr ở bước cuối.
  # Lưu ý: áp dụng từ lần restart chunk kế tiếp (không ảnh hưởng phần đã train).
  lr_schedule: cosine
  min_lr_ratio: 0.05
  lr_decay_steps: 60000   # mốc cuối TOÀN CỤC cho cosine (không phải mốc cuối mỗi khối)
  early_stop_patience: 25  # đủ dài để cosine phát huy (val chững từ 8k; nếu tới ~33k vẫn không cải thiện mới dừng)
  grad_clip: 1.0
  log_every: 50
  validate_every: 1000
  validate_batches: 40   # MPS: validation dài làm phình bộ nhớ Metal → lấy 40 batch
  save_every: 1000
  num_workers: 6
  mixed_precision: true
  device: auto
  cache_features: false
  cache_dir: cache/codelung   # đã tính trước bằng `cache-features --workers 8`

phonation:
  enabled: false

vocoder_training:
  batch_size: 8
  learning_rate: 0.0002
  max_steps: 100000  # GAN cần lâu: 60k là quá ít (REVISION_PLAN_V2 §10); 100k là mức tối thiểu
  num_workers: 6
  log_every: 100
  save_every: 2000
  crop_frames: 64    # 0,68 giây @ hop 256 — đo MPS: crop 64 nhanh gần gấp đôi crop 128 (0,67 vs 1,35 s/bước, ch=16)
  hidden: 256        # nâng từ 192 — điểm ngọt tham chiếu (generator 3,53M)
  upsample_ratio: 4
  discriminator: mpd_mrd        # MPD đầy đủ 2/3/5/7/11 + MRD (thay MPD-lite 39k)
  discriminator_channels: 16    # đo MPS: ch=16 (D 7,7M) 0,67 s/bước; ch=32 (D 31M) 1,49 s/bước
  device: auto       # auto → MPS cho MPD+MRD (đã đo nhanh hơn CPU 3,8–4,7×)
  mel_weight: 5.0     # mel mới đã chuẩn hoá toàn cục → đơn vị đổi, hạ từ 45
  feature_matching_weight: 2.0
  adversarial_weight: 1.0
  stft_weight: 2.0    # multi-resolution STFT loss (spectral convergence + log-mag L1)

loss_weights:
  mel: 1.0
  duration: 1.0
  f0: 1.0
  vuv: 0.5
  energy: 0.5
  tone: 0.25
